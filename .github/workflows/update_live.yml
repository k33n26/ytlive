name: Canli Yayin ID Otomatik Guncelleyici

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytlive-auto-update
  cancel-in-progress: true

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub App Token Oluştur
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Repoyu Çek
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      - name: Güncelleme Betiğini Çalıştır
        run: python update.py

      - name: Commit ve Push
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ secrets.APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          git add channels.txt

          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı."
            exit 0
          fi

          git commit -m "Auto-update live stream IDs"
          git push origin HEAD:${{ github.ref_name }}
