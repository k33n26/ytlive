name: Canli Yayin ID Otomatik Guncelleyici

on:
  schedule:
    # Her 15 dakikada bir çalışır
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      - name: Güncelleme Betiğini Çalıştır
        run: python update.py

      - name: Değişiklikleri Pushla
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels.txt

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update live stream IDs"
            git push
          fi
