name: Canli Yayin ID Otomatik Guncelleyici

on:
  schedule:
    # Her 15 dakikada bir çalışır
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub App Token Oluştur
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Repoyu Çek
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      - name: Güncelleme Betiğini Çalıştır
        run: python update.py

      - name: Değişiklikleri Commit ve Pushla
        run: |
          git config user.name "ytlive-bot[bot]"
          git config user.email "${{ secrets.APP_ID }}+ytlive-bot[bot]@users.noreply.github.com"

          git add channels.txt

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi

          git commit -m "Auto-update live stream IDs"
          git push origin HEAD:${{ github.ref_name }}
